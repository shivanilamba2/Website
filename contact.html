<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Shivani Lamba</title>
  <meta name="description" content="Get in touch with Shivani Lamba for classes, private lessons, event choreography and collaborations.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero wrap">
      <div class="grid">
        <div class="col-7 stack-lg">
          <p class="eyebrow reveal">Contact</p>
          <h1 class="display" data-split>Let’s<br>chat!</h1>
          <div class="contact-lines stack reveal">
            <a class="link-line" href="mailto:shivlambda@gmail.com">shivlambda@gmail.com</a><br>
            <a class="link-line" href="https://www.instagram.com/shivlambda/" target="_blank" rel="noopener">@shivlambda</a>
          </div>
        </div>
        <div class="col-4 start-9" style="grid-column-end:-1;align-self:end">
          <div class="media media--portrait reveal-img" data-parallax="6">
            <img src="assets/img/shivani-9.jpg" alt="Portrait of Shivani against deep blue" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <section class="section wrap">
      <div class="class-list">
        <a class="class-row" data-book><span class="muted">01</span><h3>Book a class or workshop</h3><span>↗</span></a>
        <a class="class-row" href="https://calendly.com/shivlambda/new-meeting" target="_blank" rel="noopener"><span class="muted">02</span><h3>Schedule a private lesson</h3><span>↗</span></a>
        <a class="class-row" href="mailto:shivlambda@gmail.com?subject=Event%20choreography%20quote"><span class="muted">03</span><h3>Request an event choreography quote</h3><span>→</span></a>
        <a class="class-row" href="mailto:shivlambda@gmail.com?subject=Collaboration"><span class="muted">04</span><h3>Collaborations &amp; bookings</h3><span>→</span></a>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
